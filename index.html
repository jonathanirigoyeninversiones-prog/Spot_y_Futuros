<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ Filtro Anti-Meme - Spot Binance (v2)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0b0e11;
            color: #eaecef;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f0b90b, #f8d33a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #848e9c;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .controls {
            background: #1e2329;
            padding: 20px 25px;
            border-radius: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            border: 1px solid #2b3139;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .control-group label {
            color: #b7bdc6;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .control-group input[type="number"], .control-group input[type="text"] {
            background: #0b0e11;
            border: 1px solid #2b3139;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            width: 150px;
            font-size: 0.9rem;
        }
        .control-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #f0b90b;
            cursor: pointer;
        }
        .actions-right {
            display: flex;
            gap: 10px;
            margin-left: auto;
            align-items: center;
        }
        .btn-recommended {
            background: #2b3139;
            color: #f0b90b;
            border: 1px solid #f0b90b;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-recommended:hover {
            background: #f0b90b22;
            transform: scale(1.02);
        }
        .btn-refresh {
            background: #f0b90b;
            color: #0b0e11;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-refresh:hover {
            background: #d4a009;
            transform: scale(1.02);
        }
        .btn-refresh:disabled, .btn-recommended:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .stats {
            background: #1e2329;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            border-left: 4px solid #f0b90b;
            font-size: 0.95rem;
        }
        .stats span {
            color: #f0b90b;
            font-weight: 700;
        }
        .table-wrapper {
            background: #1e2329;
            border-radius: 16px;
            overflow-x: auto;
            border: 1px solid #2b3139;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th {
            background: #151a20;
            color: #b7bdc6;
            font-weight: 600;
            text-align: left;
            padding: 16px 18px;
            border-bottom: 2px solid #2b3139;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        th:hover {
            background: #2b3139;
            color: #f0b90b;
        }
        th span.sort-indicator {
            font-size: 0.75rem;
            margin-left: 5px;
            color: #f0b90b;
        }
        td {
            padding: 14px 18px;
            border-bottom: 1px solid #2b3139;
            color: #eaecef;
        }
        tr:hover td {
            background: #262d35;
        }
        .symbol {
            font-weight: 700;
            color: #f0b90b;
        }
        .positive {
            color: #0ecb81;
        }
        .negative {
            color: #f6465d;
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #848e9c;
        }
        .spinner {
            border: 4px solid #2b3139;
            border-top: 4px solid #f0b90b;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .empty {
            text-align: center;
            padding: 50px;
            color: #848e9c;
        }
        @media (max-width: 1100px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .actions-right {
                margin-left: 0;
                justify-content: space-between;
            }
            .control-group {
                justify-content: space-between;
            }
            .control-group input[type="number"], .control-group input[type="text"] {
                width: 140px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Anti-Meme Spot Scanner v2</h1>
        <p class="subtitle">Conexión directa a Binance · Búsqueda activa, formato numérico financiero y ordenamiento cíclico</p>

        <div class="controls">
            <div class="control-group">
                <label>💰 Vol. Mín (USDT)</label>
                <input type="number" id="minVolume" value="10000000" step="500000">
            </div>
            <div class="control-group">
                <label>💲 Precio Mín</label>
                <input type="number" id="minPrice" value="0.001" step="0.0001">
            </div>
            <div class="control-group">
                <label>📊 Trades Mín (24h)</label>
                <input type="number" id="minTrades" value="1000" step="100">
            </div>
            <div class="control-group">
                <label>🔍 Búsqueda Activa</label>
                <input type="text" id="searchFilter" placeholder="Ej. BTC, ETH...">
            </div>
            <div class="control-group">
                <label>🚫 Excluir Memes</label>
                <input type="checkbox" id="excludeMemes" checked>
            </div>
            
            <div class="actions-right">
                <button class="btn-recommended" id="recommendedBtn" title="Restablecer valores recomendados">⭐ Recomendado</button>
                <button class="btn-refresh" id="refreshBtn">🔁 Escanear</button>
            </div>
        </div>

        <div class="stats" id="statsBar">
            <span>⏳ Cargando datos desde Binance...</span>
            <span id="countDisplay">0 encontrados</span>
        </div>

        <div class="table-wrapper">
            <div id="tableContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Conectando con la API de Binance...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ----- VALORES RECOMENDADOS ORIGINALES -----
            const RECOMMENDED_VALUES = {
                minVolume: 10000000,
                minPrice: 0.001,
                minTrades: 1000,
                excludeMemes: true,
                searchFilter: ''
            };

            // ----- LISTA NEGRA ANTI-MEME -----
            const MEME_BLACKLIST = /\b(INU|SHIB|DOGE|PEPE|FLOKI|BONK|WOJAK|ELON|MOON|SAFE|KISHU|AKITA|TOSHI|BRETT|MOG|PONKE|BABY|HARRY|TRUMP|BIDEN|NEIRO|MEW|MYRO|CAT(?!.*HER)|DOG(?!.*E)|SAMO|LADYS|COQ|TURBO|ANDY|WIF|GIGA|MAGA|POPCAT|BOME|SLERF|DUCK|GOAT|PNUT|CHILL|SPX|SUNDOG)\b/i;

            // ----- ESTADO GLOBAL DE DATOS Y ORDENAMIENTO -----
            let rawMasterData = [];
            let currentSortColumn = 'volume';
            let currentSortDirection = 'desc'; // 'asc', 'desc', o 'none'

            // ----- ELEMENTOS DOM -----
            const minVolumeInput = document.getElementById('minVolume');
            const minPriceInput = document.getElementById('minPrice');
            const minTradesInput = document.getElementById('minTrades');
            const searchFilterInput = document.getElementById('searchFilter');
            const excludeMemesCheck = document.getElementById('excludeMemes');
            const recommendedBtn = document.getElementById('recommendedBtn');
            const refreshBtn = document.getElementById('refreshBtn');
            const tableContainer = document.getElementById('tableContainer');
            const countDisplay = document.getElementById('countDisplay');

            // ----- FORMATEADOR NUMÉRICO (XXX.XXX,XX) -----
            function formatNumber(num, decimals = 2) {
                if (isNaN(num) || num === null) return '0,00';
                
                // Redondear a los decimales requeridos
                const fixed = num.toFixed(decimals);
                const parts = fixed.split('.');
                let integerPart = parts[0];
                const decimalPart = parts[1] || '';

                // Agregar puntos como separadores de miles
                integerPart = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');

                return decimals > 0 ? `${integerPart},${decimalPart}` : integerPart;
            }

            // ----- CARGAR CONFIGURACIÓN DESDE LOCALSTORAGE -----
            function loadSavedSettings() {
                const savedVolume = localStorage.getItem('scan_minVolume');
                const savedPrice = localStorage.getItem('scan_minPrice');
                const savedTrades = localStorage.getItem('scan_minTrades');
                const savedExclude = localStorage.getItem('scan_excludeMemes');
                const savedSearch = localStorage.getItem('scan_searchFilter');

                minVolumeInput.value = savedVolume !== null ? savedVolume : RECOMMENDED_VALUES.minVolume;
                minPriceInput.value = savedPrice !== null ? savedPrice : RECOMMENDED_VALUES.minPrice;
                minTradesInput.value = savedTrades !== null ? savedTrades : RECOMMENDED_VALUES.minTrades;
                searchFilterInput.value = savedSearch !== null ? savedSearch : RECOMMENDED_VALUES.searchFilter;
                excludeMemesCheck.checked = savedExclude !== null ? savedExclude === 'true' : RECOMMENDED_VALUES.excludeMemes;
            }

            // ----- GUARDAR CONFIGURACIÓN EN LOCALSTORAGE -----
            function saveSettings() {
                localStorage.setItem('scan_minVolume', minVolumeInput.value);
                localStorage.setItem('scan_minPrice', minPriceInput.value);
                localStorage.setItem('scan_minTrades', minTradesInput.value);
                localStorage.setItem('scan_searchFilter', searchFilterInput.value);
                localStorage.setItem('scan_excludeMemes', excludeMemesCheck.checked);
            }

            // ----- RESTABLECER A VALORES RECOMENDADOS -----
            function applyRecommended() {
                minVolumeInput.value = RECOMMENDED_VALUES.minVolume;
                minPriceInput.value = RECOMMENDED_VALUES.minPrice;
                minTradesInput.value = RECOMMENDED_VALUES.minTrades;
                searchFilterInput.value = RECOMMENDED_VALUES.searchFilter;
                excludeMemesCheck.checked = RECOMMENDED_VALUES.excludeMemes;

                // Limpiar localStorage
                localStorage.removeItem('scan_minVolume');
                localStorage.removeItem('scan_minPrice');
                localStorage.removeItem('scan_minTrades');
                localStorage.removeItem('scan_searchFilter');
                localStorage.removeItem('scan_excludeMemes');

                processAndRender();
            }

            // ----- DESCARGAR DATOS DESDE BINANCE -----
            async function fetchFromBinance() {
                refreshBtn.disabled = true;
                refreshBtn.textContent = '⏳ Cargando...';
                tableContainer.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Descargando datos de Binance...</p>
                    </div>
                `;
                countDisplay.textContent = '⏳ consultando...';

                try {
                    const infoRes = await fetch('https://api.binance.com/api/v3/exchangeInfo');
                    if (!infoRes.ok) throw new Error('Error al obtener exchangeInfo');
                    const info = await infoRes.json();
                    
                    const usdtSymbols = info.symbols
                        .filter(s => s.quoteAsset === 'USDT' && s.status === 'TRADING')
                        .map(s => s.symbol);
                    
                    if (usdtSymbols.length === 0) throw new Error('No se encontraron pares USDT');

                    const tickerRes = await fetch('https://api.binance.com/api/v3/ticker/24hr');
                    if (!tickerRes.ok) throw new Error('Error al obtener ticker 24h');
                    const tickerData = await tickerRes.json();

                    const tickerMap = {};
                    tickerData.forEach(t => { tickerMap[t.symbol] = t; });

                    rawMasterData = [];
                    for (const symbol of usdtSymbols) {
                        const t = tickerMap[symbol];
                        if (!t) continue;

                        rawMasterData.push({
                            symbol,
                            price: parseFloat(t.lastPrice),
                            volume: parseFloat(t.quoteVolume),
                            trades: parseInt(t.count),
                            change: parseFloat(t.priceChangePercent)
                        });
                    }

                    processAndRender();

                } catch (error) {
                    console.error(error);
                    tableContainer.innerHTML = `
                        <div class="empty">
                            <p style="color: #f6465d;">❌ Error: ${error.message}</p>
                            <p style="margin-top:10px; color:#848e9c;">Verifica tu conexión a internet o la disponibilidad de la API.</p>
                        </div>
                    `;
                    countDisplay.textContent = '⚠️ Error';
                } finally {
                    refreshBtn.disabled = false;
                    refreshBtn.textContent = '🔁 Escanear';
                }
            }

            // ----- FILTRAR Y ORDENAR DATOS EN MEMORIA -----
            function processAndRender() {
                const minVolume = parseFloat(minVolumeInput.value) || 0;
                const minPrice = parseFloat(minPriceInput.value) || 0;
                const minTrades = parseInt(minTradesInput.value) || 0;
                const excludeMemes = excludeMemesCheck.checked;
                const searchText = searchFilterInput.value.trim().toLowerCase();

                let filtered = rawMasterData.filter(item => {
                    if (item.volume < minVolume) return false;
                    if (item.price < minPrice) return false;
                    if (item.trades < minTrades) return false;
                    if (excludeMemes && MEME_BLACKLIST.test(item.symbol)) return false;
                    if (searchText && !item.symbol.toLowerCase().includes(searchText)) return false;
                    return true;
                });

                // Aplicar Ordenamiento Cíclico
                if (currentSortDirection !== 'none') {
                    filtered.sort((a, b) => {
                        let valA = a[currentSortColumn];
                        let valB = b[currentSortColumn];

                        if (typeof valA === 'string') {
                            valA = valA.toLowerCase();
                            valB = valB.toLowerCase();
                        }

                        if (valA < valB) return currentSortDirection === 'asc' ? -1 : 1;
                        if (valA > valB) return currentSortDirection === 'asc' ? 1 : -1;
                        return 0;
                    });
                }

                renderTable(filtered, rawMasterData.length);
            }

            // ----- RENDERIZADO DE LA TABLA -----
            function renderTable(results, totalPairs) {
                const count = results.length;
                countDisplay.textContent = `✅ ${count} criptos pasan el filtro (de ${totalPairs} pares USDT totales)`;

                if (count === 0) {
                    tableContainer.innerHTML = `
                        <div class="empty">
                            <p style="font-size:1.2rem;">🔎 No se encontraron criptos que cumplan los filtros actuales</p>
                            <p style="color:#848e9c; margin-top:5px;">Prueba ajustando los parámetros, limpiando la búsqueda activa o haciendo clic en "Recomendado".</p>
                        </div>
                    `;
                    return;
                }

                const getIndicator = (col) => {
                    if (currentSortColumn !== col || currentSortDirection === 'none') return '';
                    return `<span class="sort-indicator">${currentSortDirection === 'asc' ? '▲ (A-Z)' : '▼ (Z-A)'}</span>`;
                };

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 50px;">#</th>
                                <th data-col="symbol">Símbolo ${getIndicator('symbol')}</th>
                                <th data-col="price">Precio (USDT) ${getIndicator('price')}</th>
                                <th data-col="volume">Volumen 24h (USDT) ${getIndicator('volume')}</th>
                                <th data-col="change">Cambio 24h % ${getIndicator('change')}</th>
                                <th data-col="trades">Nº Trades (24h) ${getIndicator('trades')}</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                results.forEach((item, index) => {
                    const changeClass = item.change >= 0 ? 'positive' : 'negative';
                    const changeSign = item.change >= 0 ? '+' : '';
                    
                    // Definición de decimales dinámicos según el precio
                    const decimalsPrice = item.price < 0.0001 ? 8 : item.price < 0.01 ? 6 : 2;
                    const formattedPrice = formatNumber(item.price, decimalsPrice);
                    
                    const formattedVolume = formatNumber(item.volume, 2);
                    const formattedChange = formatNumber(item.change, 2);
                    const formattedTrades = formatNumber(item.trades, 0);

                    html += `
                        <tr>
                            <td>${index + 1}</td>
                            <td class="symbol">${item.symbol}</td>
                            <td>$${formattedPrice}</td>
                            <td>$${formattedVolume}</td>
                            <td class="${changeClass}">${changeSign}${formattedChange}%</td>
                            <td>${formattedTrades}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                tableContainer.innerHTML = html;

                // Añadir eventos de clic a las cabeceras para el ordenamiento cíclico
                document.querySelectorAll('th[data-col]').forEach(th => {
                    th.addEventListener('click', () => {
                        const col = th.getAttribute('data-col');
                        if (currentSortColumn === col) {
                            if (currentSortDirection === 'desc') {
                                currentSortDirection = 'asc';
                            } else if (currentSortDirection === 'asc') {
                                currentSortDirection = 'none';
                            } else {
                                currentSortDirection = 'desc';
                            }
                        } else {
                            currentSortColumn = col;
                            currentSortDirection = 'desc'; // Por defecto descendente al cambiar de columna
                        }
                        processAndRender();
                    });
                });
            }

            // ----- EVENTOS DE ENTRADA Y CONTROLES -----
            refreshBtn.addEventListener('click', fetchFromBinance);
            recommendedBtn.addEventListener('click', applyRecommended);

            // Búsqueda activa instantánea por cada letra que se escriba
            searchFilterInput.addEventListener('input', () => {
                saveSettings();
                processAndRender();
            });

            const inputs = [minVolumeInput, minPriceInput, minTradesInput, excludeMemesCheck];
            let debounceTimer;
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    saveSettings();
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(processAndRender, 300);
                });
                input.addEventListener('change', () => {
                    saveSettings();
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(processAndRender, 300);
                });
            });

            // ----- INICIALIZACIÓN -----
            loadSavedSettings();
            fetchFromBinance();
        })();
    </script>
</body>
</html>
