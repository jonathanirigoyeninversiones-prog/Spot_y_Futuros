<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro Binance - Spot y Futuros</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #00ffcc;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
        }
        .tab-btn {
            background: #2a2a2a;
            color: #b0b0b0;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }
        .tab-btn.active {
            background: #00ffcc;
            color: #121212;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 14px;
            margin-bottom: 5px;
            color: #b0b0b0;
        }
        input {
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
        }
        button.action-btn {
            background: #00ffcc;
            color: #121212;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            grid-column: 1 / -1;
            transition: background 0.3s;
        }
        button.action-btn:hover {
            background: #00b388;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #252525;
            color: #00ffcc;
        }
        tr:nth-child(even) {
            background-color: #1a1a1a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Filtro de Mercado Binance</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(event, 'spotTab')">Spot</button>
            <button class="tab-btn" onclick="switchTab(event, 'futuresTab')">Futuros</button>
        </div>

        <div id="spotTab" class="tab-content active">
            <h2>Panel Spot</h2>
            <div class="controls">
                <div class="control-group">
                    <label for="spotVol">Volumen Mínimo (USDT):</label>
                    <input type="number" id="spotVol" value="500000">
                </div>
                <div class="control-group">
                    <label for="spotTrades">Trades Mínimos:</label>
                    <input type="number" id="spotTrades" value="1000">
                </div>
                <button class="action-btn" onclick="loadSpotMarket()">🔄 Escanear Spot</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Símbolo</th>
                        <th>Precio (USDT)</th>
                        <th>Volumen (24h)</th>
                        <th>Trades</th>
                    </tr>
                </thead>
                <tbody id="spotBody">
                    <tr><td colspan="4" style="text-align: center; color: #777;">Sin datos. Presiona escanear.</td></tr>
                </tbody>
            </table>
        </div>

        <div id="futuresTab" class="tab-content">
            <h2>Panel Futuros</h2>
            <div class="controls">
                <div class="control-group">
                    <label for="futVol">Volumen Mínimo (USDT):</label>
                    <input type="number" id="futVol" value="1000000">
                </div>
                <div class="control-group">
                    <label for="futTrades">Trades Mínimos:</label>
                    <input type="number" id="futTrades" value="1000">
                </div>
                <button class="action-btn" onclick="loadFuturesMarket()">🔄 Escanear Futuros</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Símbolo</th>
                        <th>Precio (USDT)</th>
                        <th>Volumen (24h)</th>
                        <th>Trades</th>
                    </tr>
                </thead>
                <tbody id="futBody">
                    <tr><td colspan="4" style="text-align: center; color: #777;">Sin datos. Presiona escanear.</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        function switchTab(evt, tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        // Función exclusiva para la API de Spot (evita cruces)
        async function loadSpotMarket() {
            const volInput = document.getElementById('spotVol');
            const tradesInput = document.getElementById('spotTrades');
            const tbody = document.getElementById('spotBody');

            const minVol = parseFloat(volInput.value) || 0;
            const minTr = parseInt(tradesInput.value) || 0;

            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #00ffcc;">⏳ Conectando con Binance Spot...</td></tr>`;

            try {
                const response = await fetch('https://api.binance.com/api/v3/ticker/24hr');
                if (!response.ok) throw new Error('Fallo en la API de Spot');

                const data = await response.json();

                const filtered = data.filter(item => {
                    const volume = parseFloat(item.quoteVolume);
                    const trades = parseInt(item.count) || 0;
                    const symbol = item.symbol;

                    if (!symbol.endsWith('USDT')) return false;
                    if (volume < minVol) return false;
                    if (trades < minTr) return false;

                    return true;
                });

                if (filtered.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ffaa00;">Ningún activo Spot cumple con los filtros.</td></tr>`;
                    return;
                }

                let html = '';
                filtered.forEach(item => {
                    const price = parseFloat(item.lastPrice).toFixed(4);
                    const volume = parseFloat(item.quoteVolume).toLocaleString('en-US', {maximumFractionDigits: 0});
                    const trades = parseInt(item.count).toLocaleString('en-US');

                    html += `
                        <tr>
                            <td><strong>${item.symbol}</strong></td>
                            <td>${price}</td>
                            <td>$${volume}</td>
                            <td>${trades}</td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;

            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ff5555;">Error: ${error.message}</td></tr>`;
            }
        }

        // Función exclusiva para la API de Futuros (evita cruces)
        async function loadFuturesMarket() {
            const volInput = document.getElementById('futVol');
            const tradesInput = document.getElementById('futTrades');
            const tbody = document.getElementById('futBody');

            const minVol = parseFloat(volInput.value) || 0;
            const minTr = parseInt(tradesInput.value) || 0;

            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #00ffcc;">⏳ Conectando con Binance Futuros...</td></tr>`;

            try {
                const response = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
                if (!response.ok) throw new Error('Fallo en la API de Futuros');

                const data = await response.json();

                const filtered = data.filter(item => {
                    const volume = parseFloat(item.quoteVolume);
                    const trades = parseInt(item.count) || 0;
                    const symbol = item.symbol;

                    if (!symbol.endsWith('USDT')) return false;
                    if (volume < minVol) return false;
                    if (trades < minTr) return false;

                    return true;
                });

                if (filtered.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ffaa00;">Ningún activo de Futuros cumple con los filtros.</td></tr>`;
                    return;
                }

                let html = '';
                filtered.forEach(item => {
                    const price = parseFloat(item.lastPrice).toFixed(4);
                    const volume = parseFloat(item.quoteVolume).toLocaleString('en-US', {maximumFractionDigits: 0});
                    const trades = parseInt(item.count).toLocaleString('en-US');

                    html += `
                        <tr>
                            <td><strong>${item.symbol}</strong></td>
                            <td>${price}</td>
                            <td>$${volume}</td>
                            <td>${trades}</td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;

            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ff5555;">Error: ${error.message}</td></tr>`;
            }
        }
    </script>
</body>
</html>
