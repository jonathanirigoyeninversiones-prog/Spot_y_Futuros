<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Filtro Anti-Meme - Spot Binance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0b0e11;
            color: #eaecef;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f0b90b, #f8d33a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #848e9c;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .controls {
            background: #1e2329;
            padding: 20px 25px;
            border-radius: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 25px;
            margin-bottom: 25px;
            border: 1px solid #2b3139;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .control-group label {
            color: #b7bdc6;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .control-group input[type="number"] {
            background: #0b0e11;
            border: 1px solid #2b3139;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            width: 130px;
            font-size: 0.9rem;
        }
        .control-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #f0b90b;
            cursor: pointer;
        }
        .btn-refresh {
            background: #f0b90b;
            color: #0b0e11;
            border: none;
            padding: 10px 28px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            margin-left: auto;
        }
        .btn-refresh:hover {
            background: #d4a009;
            transform: scale(1.02);
        }
        .btn-refresh:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .stats {
            background: #1e2329;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            border-left: 4px solid #f0b90b;
            font-size: 0.95rem;
        }
        .stats span {
            color: #f0b90b;
            font-weight: 700;
        }
        .table-wrapper {
            background: #1e2329;
            border-radius: 16px;
            overflow-x: auto;
            border: 1px solid #2b3139;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th {
            background: #151a20;
            color: #b7bdc6;
            font-weight: 600;
            text-align: left;
            padding: 16px 18px;
            border-bottom: 2px solid #2b3139;
            white-space: nowrap;
        }
        td {
            padding: 14px 18px;
            border-bottom: 1px solid #2b3139;
            color: #eaecef;
        }
        tr:hover td {
            background: #262d35;
        }
        .symbol {
            font-weight: 700;
            color: #f0b90b;
        }
        .positive {
            color: #0ecb81;
        }
        .negative {
            color: #f6465d;
        }
        .badge-meme {
            background: #f6465d22;
            color: #f6465d;
            border: 1px solid #f6465d44;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 8px;
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #848e9c;
        }
        .spinner {
            border: 4px solid #2b3139;
            border-top: 4px solid #f0b90b;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .empty {
            text-align: center;
            padding: 50px;
            color: #848e9c;
        }
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-refresh {
                margin-left: 0;
            }
            .control-group {
                justify-content: space-between;
            }
            .control-group input[type="number"] {
                width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Anti-Meme Spot Scanner</h1>
        <p class="subtitle">Conexión directa a Binance · Filtra memes por volumen, precio, actividad y nombre</p>

        <div class="controls">
            <div class="control-group">
                <label>💰 Vol. Mín (USDT)</label>
                <input type="number" id="minVolume" value="500000" step="10000">
            </div>
            <div class="control-group">
                <label>💲 Precio Mín</label>
                <input type="number" id="minPrice" value="0.001" step="0.0001">
            </div>
            <div class="control-group">
                <label>📊 Trades Mín (24h)</label>
                <input type="number" id="minTrades" value="1000" step="100">
            </div>
            <div class="control-group">
                <label>🚫 Filtrar por nombre Meme</label>
                <input type="checkbox" id="excludeMemes" checked>
            </div>
            <button class="btn-refresh" id="refreshBtn">🔁 Escanear ahora</button>
        </div>

        <div class="stats" id="statsBar">
            <span>⏳ Cargando datos desde Binance...</span>
            <span id="countDisplay">0 encontrados</span>
        </div>

        <div class="table-wrapper">
            <div id="tableContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Conectando con la API de Binance...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ----- CONFIGURACIÓN DE FILTRO ANTI-MEME (BLACKLIST) -----
            const MEME_BLACKLIST = /\b(INU|SHIB|DOGE|PEPE|FLOKI|BONK|WOJAK|ELON|MOON|SAFE|KISHU|AKITA|TOSHI|BRETT|MOG|PONKE|BABY|HARRY|TRUMP|BIDEN|NEIRO|MEW|MYRO|CAT(?!.*HER)|DOG(?!.*E)|SAMO|LADYS|COQ|TURBO|ANDY|WIF|GIGA|MAGA)\b/i;

            // ----- ELEMENTOS DOM -----
            const minVolumeInput = document.getElementById('minVolume');
            const minPriceInput = document.getElementById('minPrice');
            const minTradesInput = document.getElementById('minTrades');
            const excludeMemesCheck = document.getElementById('excludeMemes');
            const refreshBtn = document.getElementById('refreshBtn');
            const tableContainer = document.getElementById('tableContainer');
            const countDisplay = document.getElementById('countDisplay');

            // ----- FUNCIÓN PRINCIPAL -----
            async function fetchAndFilter() {
                // Deshabilitar botón y mostrar loading
                refreshBtn.disabled = true;
                refreshBtn.textContent = '⏳ Cargando...';
                tableContainer.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Descargando datos de ${'https://api.binance.com'} ...</p>
                    </div>
                `;
                countDisplay.textContent = '⏳ consultando...';

                try {
                    // 1. Obtener lista de todos los símbolos Spot de Binance (solo pares USDT)
                    const infoRes = await fetch('https://api.binance.com/api/v3/exchangeInfo');
                    if (!infoRes.ok) throw new Error('Error al obtener exchangeInfo');
                    const info = await infoRes.json();
                    
                    const usdtSymbols = info.symbols
                        .filter(s => s.quoteAsset === 'USDT' && s.status === 'TRADING')
                        .map(s => s.symbol);
                    
                    if (usdtSymbols.length === 0) throw new Error('No se encontraron pares USDT');

                    // 2. Obtener ticker 24h de todos los pares
                    const tickerRes = await fetch('https://api.binance.com/api/v3/ticker/24hr');
                    if (!tickerRes.ok) throw new Error('Error al obtener ticker 24h');
                    const tickerData = await tickerRes.json();

                    // 3. Construir mapa rápido { symbol: data }
                    const tickerMap = {};
                    tickerData.forEach(t => { tickerMap[t.symbol] = t; });

                    // 4. Leer filtros de la UI
                    const minVolume = parseFloat(minVolumeInput.value) || 0;
                    const minPrice = parseFloat(minPriceInput.value) || 0;
                    const minTrades = parseInt(minTradesInput.value) || 0;
                    const excludeMemes = excludeMemesCheck.checked;

                    // 5. Aplicar filtros
                    const results = [];
                    for (const symbol of usdtSymbols) {
                        const t = tickerMap[symbol];
                        if (!t) continue; // Si no tiene ticker 24h, lo saltamos

                        const volume = parseFloat(t.quoteVolume);
                        const price = parseFloat(t.lastPrice);
                        const trades = parseInt(t.count);
                        const change = parseFloat(t.priceChangePercent);

                        // Filtros duros
                        if (volume < minVolume) continue;
                        if (price < minPrice) continue;
                        if (trades < minTrades) continue;

                        // Filtro anti-meme por nombre (si está activado)
                        if (excludeMemes && MEME_BLACKLIST.test(symbol)) {
                            continue;
                        }

                        results.push({
                            symbol,
                            price,
                            volume,
                            trades,
                            change,
                            // Indicar si fue excluido por meme (para mostrarlo en tooltip, no aplica aquí porque ya fue filtrado)
                        });
                    }

                    // Ordenar por volumen descendente (los más grandes primero)
                    results.sort((a, b) => b.volume - a.volume);

                    // 6. Renderizar resultados
                    renderTable(results, usdtSymbols.length);

                } catch (error) {
                    console.error(error);
                    tableContainer.innerHTML = `
                        <div class="empty">
                            <p style="color: #f6465d;">❌ Error: ${error.message}</p>
                            <p style="margin-top:10px; color:#848e9c;">Verifica tu conexión a internet o que la API de Binance esté accesible.</p>
                        </div>
                    `;
                    countDisplay.textContent = '⚠️ Error';
                } finally {
                    refreshBtn.disabled = false;
                    refreshBtn.textContent = '🔁 Escanear ahora';
                }
            }

            // ----- RENDERIZADO DE TABLA -----
            function renderTable(results, totalPairs) {
                const count = results.length;
                countDisplay.textContent = `✅ ${count} criptos pasan el filtro (de ${totalPairs} pares USDT totales)`;

                if (count === 0) {
                    tableContainer.innerHTML = `
                        <div class="empty">
                            <p style="font-size:1.2rem;">🔎 No se encontraron criptos que cumplan los filtros</p>
                            <p style="color:#848e9c;">Prueba bajando el volumen mínimo o el precio mínimo.</p>
                        </div>
                    `;
                    return;
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Símbolo</th>
                                <th>Precio (USDT)</th>
                                <th>Volumen 24h (USDT)</th>
                                <th>Cambio 24h %</th>
                                <th>Nº Trades (24h)</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                results.forEach((item, index) => {
                    const changeClass = item.change >= 0 ? 'positive' : 'negative';
                    const changeSign = item.change >= 0 ? '+' : '';
                    const formattedPrice = item.price < 0.0001 ? item.price.toFixed(8) : 
                                           item.price < 0.01 ? item.price.toFixed(6) : 
                                           item.price.toFixed(2);
                    const formattedVolume = item.volume >= 1e6 ? (item.volume / 1e6).toFixed(2) + 'M' :
                                            item.volume >= 1e3 ? (item.volume / 1e3).toFixed(1) + 'K' :
                                            item.volume.toFixed(0);

                    html += `
                        <tr>
                            <td>${index + 1}</td>
                            <td class="symbol">${item.symbol}</td>
                            <td>$${formattedPrice}</td>
                            <td>$${formattedVolume}</td>
                            <td class="${changeClass}">${changeSign}${item.change.toFixed(2)}%</td>
                            <td>${item.trades.toLocaleString()}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                tableContainer.innerHTML = html;
            }

            // ----- EVENTOS -----
            refreshBtn.addEventListener('click', fetchAndFilter);

            // Al cambiar cualquier input, también escaneamos de nuevo (con debounce)
            const inputs = [minVolumeInput, minPriceInput, minTradesInput, excludeMemesCheck];
            let debounceTimer;
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(fetchAndFilter, 400);
                });
                input.addEventListener('change', () => {
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(fetchAndFilter, 400);
                });
            });

            // ----- CARGA INICIAL -----
            fetchAndFilter();
        })();
    </script>
</body>
</html>
