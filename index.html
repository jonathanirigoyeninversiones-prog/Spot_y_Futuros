<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ ccc Spot Scanner - Confluencia 1d + 4h (Corregido)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0b0e11;
            color: #eaecef;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f0b90b, #f8d33a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #848e9c;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .controls {
            background: #1e2329;
            padding: 20px 25px;
            border-radius: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            border: 1px solid #2b3139;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .control-group label {
            color: #b7bdc6;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .control-group input[type="number"], .control-group input[type="text"] {
            background: #0b0e11;
            border: 1px solid #2b3139;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            width: 140px;
            font-size: 0.9rem;
        }
        .ema-row {
            display: flex;
            gap: 15px;
            width: 100%;
            padding-top: 10px;
            border-top: 1px solid #2b3139;
            flex-wrap: wrap;
            align-items: center;
        }
        .actions-right {
            display: flex;
            gap: 10px;
            margin-left: auto;
            align-items: center;
        }
        .timer-box {
            background: #0b0e11;
            border: 1px solid #f0b90b;
            color: #f0b90b;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn-recommended {
            background: #2b3139;
            color: #f0b90b;
            border: 1px solid #f0b90b;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-recommended:hover {
            background: #f0b90b22;
            transform: scale(1.02);
        }
        .btn-refresh {
            background: #f0b90b;
            color: #0b0e11;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-refresh:hover {
            background: #d4a009;
            transform: scale(1.02);
        }
        .btn-refresh:disabled, .btn-recommended:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .stats {
            background: #1e2329;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: flex-end;
            border-left: 4px solid #f0b90b;
            font-size: 0.95rem;
        }
        .stats span {
            color: #f0b90b;
            font-weight: 700;
        }
        .table-wrapper {
            background: #1e2329;
            border-radius: 16px;
            overflow-x: auto;
            border: 1px solid #2b3139;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th {
            background: #151a20;
            color: #b7bdc6;
            font-weight: 600;
            text-align: left;
            padding: 16px 18px;
            border-bottom: 2px solid #2b3139;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        th:hover {
            background: #2b3139;
            color: #f0b90b;
        }
        th span.sort-indicator {
            font-size: 0.75rem;
            margin-left: 5px;
            color: #f0b90b;
        }
        td {
            padding: 14px 18px;
            border-bottom: 1px solid #2b3139;
            color: #eaecef;
        }
        tr:hover td {
            background: #262d35;
        }
        .symbol {
            font-weight: 700;
            color: #f0b90b;
        }
        .positive {
            color: #0ecb81;
        }
        .negative {
            color: #f6465d;
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #848e9c;
        }
        .spinner {
            border: 4px solid #2b3139;
            border-top: 4px solid #f0b90b;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .empty {
            text-align: center;
            padding: 50px;
            color: #848e9c;
        }
        @media (max-width: 1100px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .actions-right {
                margin-left: 0;
                justify-content: space-between;
                flex-wrap: wrap;
            }
            .control-group {
                justify-content: space-between;
            }
            .control-group input[type="number"], .control-group input[type="text"] {
                width: 140px;
            }
            .ema-row {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Spot Scanner - Confluencia 1d + 4h (Corregido)</h1>
        <p class="subtitle">Conexión directa a Binance · Filtrado macro (1d) y confirmación estructural (4h) con abanico alcista estricto</p>

        <div class="controls">
            <div class="control-group">
                <label>💰 Vol. Mín (USDT)</label>
                <input type="number" id="minVolume" value="10000000" step="500000">
            </div>
            <div class="control-group">
                <label>💲 Precio Mín</label>
                <input type="number" id="minPrice" value="0.001" step="0.0001">
            </div>
            <div class="control-group">
                <label>📊 Trades Mín (24h)</label>
                <input type="number" id="minTrades" value="1000" step="100">
            </div>
            <div class="control-group">
                <label>🔍 Búsqueda Activa</label>
                <input type="text" id="searchFilter" placeholder="Ej. BTC, ETH...">
            </div>
            
            <div class="actions-right">
                <div class="timer-box" id="candleTimer" title="Tiempo restante para cierre de vela 4h">⏳ 00:00:00</div>
                <button class="btn-recommended" id="recommendedBtn" title="Restablecer valores recomendados">⭐ Recomendado</button>
                <button class="btn-refresh" id="refreshBtn">🔁 Escanear</button>
            </div>

            <div class="ema-row">
                <div class="control-group">
                    <label>📈 EMA 1 (Per.)</label>
                    <input type="number" id="ema1" value="50" step="1">
                </div>
                <div class="control-group">
                    <label>📈 EMA 2 (Per.)</label>
                    <input type="number" id="ema2" value="100" step="1">
                </div>
                <div class="control-group">
                    <label>📈 EMA 3 (Per.)</label>
                    <input type="number" id="ema3" value="200" step="1">
                </div>
            </div>
        </div>

        <div class="stats" id="statsBar">
            <span id="countDisplay">0 encontrados</span>
        </div>

        <div class="table-wrapper">
            <div id="tableContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Conectando con la API de Binance y validando abanico alcista estricto (1d + 4h)...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ----- VALORES RECOMENDADOS ORIGINALES -----
            const RECOMMENDED_VALUES = {
                minVolume: 10000000,
                minPrice: 0.001,
                minTrades: 1000,
                searchFilter: '',
                ema1: 50,
                ema2: 100,
                ema3: 200
            };

            // ----- ESTADO GLOBAL -----
            let rawMasterData = [];
            let currentSortColumn = 'volume';
            let currentSortDirection = 'desc';

            // ----- ELEMENTOS DOM -----
            const minVolumeInput = document.getElementById('minVolume');
            const minPriceInput = document.getElementById('minPrice');
            const minTradesInput = document.getElementById('minTrades');
            const searchFilterInput = document.getElementById('searchFilter');
            const ema1Input = document.getElementById('ema1');
            const ema2Input = document.getElementById('ema2');
            const ema3Input = document.getElementById('ema3');
            const recommendedBtn = document.getElementById('recommendedBtn');
            const refreshBtn = document.getElementById('refreshBtn');
            const tableContainer = document.getElementById('tableContainer');
            const countDisplay = document.getElementById('countDisplay');
            const candleTimerEl = document.getElementById('candleTimer');

            // ----- TEMPORIZADOR DE VELA DE 4 HORAS -----
            function startCandleTimer() {
                function updateTimer() {
                    const now = new Date();
                    const utcMs = now.getTime();
                    const intervalMs = 4 * 60 * 60 * 1000;
                    const nextCloseMs = Math.ceil(utcMs / intervalMs) * intervalMs;
                    const diffMs = nextCloseMs - utcMs;

                    const totalSeconds = Math.floor(diffMs / 1000);
                    const hours = Math.floor(totalSeconds / 3600);
                    const minutes = Math.floor((totalSeconds % 3600) / 60);
                    const seconds = totalSeconds % 60;

                    const pad = (n) => String(n).padStart(2, '0');
                    candleTimerEl.textContent = `⏳ 4h: ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
                }
                updateTimer();
                setInterval(updateTimer, 1000);
            }

            // ----- FORMATEADOR NUMÉRICO ESTÁNDAR (XXX.XXX,XX) -----
            function formatNumber(num, decimals = 2) {
                if (isNaN(num) || num === null) return '0,00';
                const fixed = num.toFixed(decimals);
                const parts = fixed.split('.');
                let integerPart = parts[0];
                const decimalPart = parts[1] || '';
                integerPart = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                return decimals > 0 ? `${integerPart},${decimalPart}` : integerPart;
            }

            // ----- FORMATEADOR DE VOLUMEN (M / K) -----
            function formatVolume(num) {
                if (isNaN(num) || num === null) return '0,00';
                if (num >= 1e6) {
                    return formatNumber(num / 1e6, 2) + 'M';
                } else if (num >= 1e3) {
                    return formatNumber(num / 1e3, 2) + 'K';
                } else {
                    return formatNumber(num, 2);
                }
            }

            // ----- CÁLCULO MATEMÁTICO DE EMA -----
            function calculateEMA(closes, period) {
                if (closes.length < period) return null;
                const k = 2 / (period + 1);
                let sum = 0;
                for (let i = 0; i < period; i++) {
                    sum += closes[i];
                }
                let ema = sum / period;
                for (let i = period; i < closes.length; i++) {
                    ema = (closes[i] * k) + (ema * (1 - k));
                }
                return ema;
            }

            // ----- CARGAR Y GUARDAR CONFIGURACIÓN -----
            function loadSavedSettings() {
                minVolumeInput.value = localStorage.getItem('scan_minVolume') ?? RECOMMENDED_VALUES.minVolume;
                minPriceInput.value = localStorage.getItem('scan_minPrice') ?? RECOMMENDED_VALUES.minPrice;
                minTradesInput.value = localStorage.getItem('scan_minTrades') ?? RECOMMENDED_VALUES.minTrades;
                searchFilterInput.value = localStorage.getItem('scan_searchFilter') ?? RECOMMENDED_VALUES.searchFilter;
                ema1Input.value = localStorage.getItem('scan_ema1') ?? RECOMMENDED_VALUES.ema1;
                ema2Input.value = localStorage.getItem('scan_ema2') ?? RECOMMENDED_VALUES.ema2;
                ema3Input.value = localStorage.getItem('scan_ema3') ?? RECOMMENDED_VALUES.ema3;
            }

            function saveSettings() {
                localStorage.setItem('scan_minVolume', minVolumeInput.value);
                localStorage.setItem('scan_minPrice', minPriceInput.value);
                localStorage.setItem('scan_minTrades', minTradesInput.value);
                localStorage.setItem('scan_searchFilter', searchFilterInput.value);
                localStorage.setItem('scan_ema1', ema1Input.value);
                localStorage.setItem('scan_ema2', ema2Input.value);
                localStorage.setItem('scan_ema3', ema3Input.value);
            }

            function applyRecommended() {
                minVolumeInput.value = RECOMMENDED_VALUES.minVolume;
                minPriceInput.value = RECOMMENDED_VALUES.minPrice;
                minTradesInput.value = RECOMMENDED_VALUES.minTrades;
                searchFilterInput.value = RECOMMENDED_VALUES.searchFilter;
                ema1Input.value = RECOMMENDED_VALUES.ema1;
                ema2Input.value = RECOMMENDED_VALUES.ema2;
                ema3Input.value = RECOMMENDED_VALUES.ema3;

                localStorage.clear();
                fetchAndFilter();
            }

            // ----- FUNCIÓN PRINCIPAL CON ABANICO ALCISTA CORREGIDO Y BLINDADO -----
            async function fetchAndFilter() {
                refreshBtn.disabled = true;
                refreshBtn.textContent = '⏳ Analizando...';
                tableContainer.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Descargando datos y validando abanico alcista (EMA 50 > 100 > 200) en 1d y 4h...</p>
                    </div>
                `;
                countDisplay.textContent = '⏳ consultando...';

                try {
                    const infoRes = await fetch('https://api.binance.com/api/v3/exchangeInfo');
                    if (!infoRes.ok) throw new Error('Error al obtener exchangeInfo');
                    const info = await infoRes.json();
                    
                    const usdtSymbols = info.symbols
                        .filter(s => s.quoteAsset === 'USDT' && s.status === 'TRADING')
                        .map(s => s.symbol);
                    
                    if (usdtSymbols.length === 0) throw new Error('No se encontraron pares USDT');

                    const tickerRes = await fetch('https://api.binance.com/api/v3/ticker/24hr');
                    if (!tickerRes.ok) throw new Error('Error al obtener ticker 24h');
                    const tickerData = await tickerRes.json();

                    const tickerMap = {};
                    tickerData.forEach(t => { tickerMap[t.symbol] = t; });

                    const minVolume = parseFloat(minVolumeInput.value) || 0;
                    const minPrice = parseFloat(minPriceInput.value) || 0;
                    const minTrades = parseInt(minTradesInput.value) || 0;
                    const p1 = parseInt(ema1Input.value) || 50;
                    const p2 = parseInt(ema2Input.value) || 100;
                    const p3 = parseInt(ema3Input.value) || 200;
                    const maxPeriod = Math.max(p1, p2, p3);

                    // 1. Filtrado duro previo en memoria
                    const candidates = [];
                    for (const symbol of usdtSymbols) {
                        const t = tickerMap[symbol];
                        if (!t) continue;
                        const volume = parseFloat(t.quoteVolume);
                        const price = parseFloat(t.lastPrice);
                        const trades = parseInt(t.count);
                        const change = parseFloat(t.priceChangePercent);

                        if (volume < minVolume) continue;
                        if (price < minPrice) continue;
                        if (trades < minTrades) continue;

                        candidates.push({ symbol, price, volume, trades, change });
                    }

                    // 2. Validación multi-temporal estricta (1d + 4h) con abanico alcista correcto
                    rawMasterData = [];
                    for (const item of candidates) {
                        try {
                            // Validar temporalidad DIARIA (1d)
                            const res1d = await fetch(`https://api.binance.com/api/v3/klines?symbol=${item.symbol}&interval=1d&limit=${maxPeriod + 50}`);
                            if (!res1d.ok) continue;
                            const klines1d = await res1d.json();
                            if (klines1d.length < maxPeriod) continue;

                            const closes1d = klines1d.map(k => parseFloat(k[4]));
                            const e1_1d = calculateEMA(closes1d, p1);
                            const e2_1d = calculateEMA(closes1d, p2);
                            const e3_1d = calculateEMA(closes1d, p3);
                            const currentPrice = item.price;

                            // CONDICIÓN CORREGIDA: Precio > EMA3 y EMA1 > EMA2 > EMA3
                            const isBullish1d = currentPrice > e3_1d && e1_1d > e2_1d && e2_1d > e3_1d;
                            if (!isBullish1d) continue;

                            // Validar temporalidad de 4 HORAS (4h)
                            const res4h = await fetch(`https://api.binance.com/api/v3/klines?symbol=${item.symbol}&interval=4h&limit=${maxPeriod + 50}`);
                            if (!res4h.ok) continue;
                            const klines4h = await res4h.json();
                            if (klines4h.length < maxPeriod) continue;

                            const closes4h = klines4h.map(k => parseFloat(k[4]));
                            const e1_4h = calculateEMA(closes4h, p1);
                            const e2_4h = calculateEMA(closes4h, p2);
                            const e3_4h = calculateEMA(closes4h, p3);

                            // CONDICIÓN CORREGIDA: Precio > EMA3 y EMA1 > EMA2 > EMA3
                            const isBullish4h = currentPrice > e3_4h && e1_4h > e2_4h && e2_4h > e3_4h;
                            if (!isBullish4h) continue;

                            rawMasterData.push(item);
                        } catch (err) {
                            console.error(`Error procesando ${item.symbol}:`, err);
                        }
                    }

                    processAndRender();

                } catch (error) {
                    console.error(error);
                    tableContainer.innerHTML = `
                        <div class="empty">
                            <p style="color: #f6465d;">❌ Error: ${error.message}</p>
                            <p style="margin-top:10px; color:#848e9c;">Verifica tu conexión a internet o la disponibilidad de la API.</p>
                        </div>
                    `;
                    countDisplay.textContent = '⚠️ Error';
                } finally {
                    refreshBtn.disabled = false;
                    refreshBtn.textContent = '🔁 Escanear';
                }
            }

            // ----- FILTRAR Y ORDENAR EN MEMORIA -----
            function processAndRender() {
                const searchText = searchFilterInput.value.trim().toLowerCase();

                let filtered = rawMasterData.filter(item => {
                    if (searchText && !item.symbol.toLowerCase().includes(searchText)) return false;
                    return true;
                });

                if (currentSortDirection !== 'none') {
                    filtered.sort((a, b) => {
                        let valA = a[currentSortColumn];
                        let valB = b[currentSortColumn];

                        if (typeof valA === 'string') {
                            valA = valA.toLowerCase();
                            valB = valB.toLowerCase();
                        }

                        if (valA < valB) return currentSortDirection === 'asc' ? -1 : 1;
                        if (valA > valB) return currentSortDirection === 'asc' ? 1 : -1;
                        return 0;
                    });
                }

                renderTable(filtered, rawMasterData.length);
            }

            // ----- RENDERIZADO DE TABLA -----
            function renderTable(results, totalPassed) {
                countDisplay.textContent = `✅ ${totalPassed} criptos con confluencia alcista estricta (1d + 4h)`;

                if (totalPassed === 0) {
                    tableContainer.innerHTML = `
                        <div class="empty">
                            <p style="font-size:1.2rem;">🔎 No se encontraron criptos con abanico alcista estricto (50 > 100 > 200)</p>
                            <p style="color:#848e9c; margin-top:5px;">Prueba ajustando los parámetros o haciendo clic en "Recomendado".</p>
                        </div>
                    `;
                    return;
                }

                const getIndicator = (col) => {
                    if (currentSortColumn !== col || currentSortDirection === 'none') return '';
                    return `<span class="sort-indicator">${currentSortDirection === 'asc' ? '▲ (A-Z)' : '▼ (Z-A)'}</span>`;
                };

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 50px;">#</th>
                                <th data-col="symbol">Símbolo ${getIndicator('symbol')}</th>
                                <th data-col="price">Precio (USDT) ${getIndicator('price')}</th>
                                <th data-col="volume">Volumen 24h (USDT) ${getIndicator('volume')}</th>
                                <th data-col="change">Cambio 24h % ${getIndicator('change')}</th>
                                <th data-col="trades">Nº Trades (24h) ${getIndicator('trades')}</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                results.forEach((item, index) => {
                    const changeClass = item.change >= 0 ? 'positive' : 'negative';
                    const changeSign = item.change >= 0 ? '+' : '';
                    
                    const decimalsPrice = item.price < 0.0001 ? 8 : item.price < 0.01 ? 6 : 2;
                    const formattedPrice = formatNumber(item.price, decimalsPrice);
                    const formattedVolume = formatVolume(item.volume);
                    const formattedChange = formatNumber(item.change, 2);
                    const formattedTrades = formatNumber(item.trades, 0);

                    html += `
                        <tr>
                            <td>${index + 1}</td>
                            <td class="symbol">${item.symbol}</td>
                            <td>$${formattedPrice}</td>
                            <td>$${formattedVolume}</td>
                            <td class="${changeClass}">${changeSign}${formattedChange}%</td>
                            <td>${formattedTrades}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                tableContainer.innerHTML = html;

                document.querySelectorAll('th[data-col]').forEach(th => {
                    th.addEventListener('click', () => {
                        const col = th.getAttribute('data-col');
                        if (currentSortColumn === col) {
                            if (currentSortDirection === 'desc') {
                                currentSortDirection = 'asc';
                            } else if (currentSortDirection === 'asc') {
                                currentSortDirection = 'none';
                            } else {
                                currentSortDirection = 'desc';
                            }
                        } else {
                            currentSortColumn = col;
                            currentSortDirection = 'desc';
                        }
                        processAndRender();
                    });
                });
            }

            // ----- EVENTOS -----
            refreshBtn.addEventListener('click', fetchAndFilter);
            recommendedBtn.addEventListener('click', applyRecommended);

            searchFilterInput.addEventListener('input', () => {
                saveSettings();
                processAndRender();
            });

            const inputs = [minVolumeInput, minPriceInput, minTradesInput, ema1Input, ema2Input, ema3Input];
            let debounceTimer;
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    saveSettings();
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(fetchAndFilter, 400);
                });
                input.addEventListener('change', () => {
                    saveSettings();
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(fetchAndFilter, 400);
                });
            });

            // ----- INICIALIZACIÓN -----
            loadSavedSettings();
            startCandleTimer();
            fetchAndFilter();
        })();
    </script>
</body>
</html>
