<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Trading - Spot y Futuros</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #00ffcc;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
        }
        .tab-btn {
            background: #2a2a2a;
            color: #b0b0b0;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }
        .tab-btn.active {
            background: #00ffcc;
            color: #121212;
            border-bottom: 2px solid #00ffcc;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 14px;
            margin-bottom: 5px;
            color: #b0b0b0;
        }
        select, input {
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
        }
        button.action-btn {
            background: #00ffcc;
            color: #121212;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            grid-column: 1 / -1;
            transition: background 0.3s;
        }
        button.action-btn:hover {
            background: #00b388;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #252525;
            color: #00ffcc;
        }
        tr:nth-child(even) {
            background-color: #1a1a1a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Análisis de Mercado Binance</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(event, 'spotSection')">Spot</button>
            <button class="tab-btn" onclick="switchTab(event, 'futuresSection')">Futuros</button>
        </div>

        <div id="spotSection" class="tab-content active">
            <h2>Filtro de Mercado Spot</h2>
            <div class="controls">
                <div class="control-group">
                    <label for="spotVolume">Volumen Mínimo (USDT):</label>
                    <input type="number" id="spotVolume" value="500000">
                </div>
                <div class="control-group">
                    <label for="spotTrades">Trades Mínimos:</label>
                    <input type="number" id="spotTrades" value="1000">
                </div>
                <button class="action-btn" onclick="fetchMarketData('spot')">🔄 Escanear Spot</button>
            </div>
            <div id="spotResults">
                <table>
                    <thead>
                        <tr>
                            <th>Símbolo</th>
                            <th>Precio (USDT)</th>
                            <th>Volumen (24h)</th>
                            <th>Trades</th>
                        </tr>
                    </thead>
                    <tbody id="spotTableBody">
                        <tr><td colspan="4" style="text-align: center; color: #777;">Sin datos de Spot.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="futuresSection" class="tab-content">
            <h2>Filtro de Mercado Futuros</h2>
            <div class="controls">
                <div class="control-group">
                    <label for="futVolume">Volumen Mínimo (USDT):</label>
                    <input type="number" id="futVolume" value="1000000">
                </div>
                <div class="control-group">
                    <label for="futTrades">Trades Mínimos:</label>
                    <input type="number" id="futTrades" value="2000">
                </div>
                <button class="action-btn" onclick="fetchMarketData('futures')">🔄 Escanear Futuros</button>
            </div>
            <div id="futuresResults">
                <table>
                    <thead>
                        <tr>
                            <th>Símbolo</th>
                            <th>Precio (USDT)</th>
                            <th>Volumen (24h)</th>
                            <th>Trades</th>
                        </tr>
                    </thead>
                    <tbody id="futTableBody">
                        <tr><td colspan="4" style="text-align: center; color: #777;">Sin datos de Futuros.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // Control de Pestañas
        function switchTab(evt, sectionId) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(c => c.classList.remove('active'));

            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(b => b.classList.remove('active'));

            document.getElementById(sectionId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        // Lógica de consumo de API según la pestaña activa
        async function fetchMarketData(type) {
            const isSpot = type === 'spot';
            const volumeInput = document.getElementById(isSpot ? 'spotVolume' : 'futVolume');
            const tradesInput = document.getElementById(isSpot ? 'spotTrades' : 'futTrades');
            const tableBody = document.getElementById(isSpot ? 'spotTableBody' : 'futTableBody');

            const minVol = parseFloat(volumeInput.value) || 0;
            const minTr = parseInt(tradesInput.value) || 0;

            tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #00ffcc;">⏳ Consultando Binance...</td></tr>`;

            try {
                // Endpoint unificado o específico según corresponda
                const apiUrl = isSpot 
                    ? 'https://api.binance.com/api/v3/ticker/24hr' 
                    : 'https://fapi.binance.com/fapi/v1/ticker/24hr';

                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Error al conectar con la API');

                const data = await response.json();

                const filtered = data.filter(item => {
                    const volume = parseFloat(item.quoteVolume);
                    const trades = parseInt(item.count) || 0;
                    const symbol = item.symbol;

                    if (!symbol.endsWith('USDT')) return false;
                    if (volume < minVol) return false;
                    if (trades < minTr) return false;

                    return true;
                });

                if (filtered.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ffaa00;">Ningún activo cumple con los filtros.</td></tr>`;
                    return;
                }

                let html = '';
                filtered.forEach(item => {
                    const price = parseFloat(item.lastPrice).toFixed(4);
                    const volume = parseFloat(item.quoteVolume).toLocaleString('en-US', {maximumFractionDigits: 0});
                    const trades = parseInt(item.count).toLocaleString('en-US');

                    html += `
                        <tr>
                            <td><strong>${item.symbol}</strong></td>
                            <td>${price}</td>
                            <td>$${volume}</td>
                            <td>${trades}</td>
                        </tr>
                    `;
                });

                tableBody.innerHTML = html;

            } catch (error) {
                console.error(error);
                tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ff5555;">Error de conexión: ${error.message}</td></tr>`;
            }
        }
    </script>
</body>
</html>
