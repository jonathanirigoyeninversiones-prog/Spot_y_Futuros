<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro Anti-Memecoin e Institucional - Binance</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            line-height: 1.25;
        }
        h1 {
            color: #00ffcc;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 14px;
            margin-bottom: 5px;
            color: #b0b0b0;
        }
        select, input {
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
        }
        button {
            background: #00ffcc;
            color: #121212;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            grid-column: 1 / -1;
            transition: background 0.3s;
        }
        button:hover {
            background: #00b388;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
            color: #00ffcc;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #252525;
            color: #00ffcc;
        }
        tr:nth-child(even) {
            background-color: #1a1a1a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Filtro Anti-Memecoin y Calidad Institucional</h1>
        
        <div class="controls">
            <div class="control-group">
                <label for="modeSelect">Modo de Configuración:</label>
                <select id="modeSelect" onchange="toggleMode()">
                    <option value="auto">Automático (Estándar Web)</option>
                    <option value="manual">Manual (Personalizado)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="minVolume">Volumen Mínimo (USDT):</label>
                <input type="number" id="minVolume" value="500000" disabled>
            </div>

            <div class="control-group">
                <label for="minPrice">Precio Mínimo (USDT):</label>
                <input type="number" id="minPrice" value="0.01" step="0.001" disabled>
            </div>

            <div class="control-group">
                <label for="minTrades">Transacciones Mínimas (Trades):</label>
                <input type="number" id="minTrades" value="1000" disabled>
            </div>

            <button id="refreshBtn" onclick="fetchAndFilter()">🔄 Analizar y Filtrar Mercado</button>
        </div>

        <div class="status-bar">
            <span id="countDisplay">Activos institucionales válidos: 0</span>
            <span id="modeStatus">Modo: Automático</span>
        </div>

        <div id="tableContainer">
            <table>
                <thead>
                    <tr>
                        <th>Símbolo</th>
                        <th>Precio (USDT)</th>
                        <th>Volumen (24h)</th>
                        <th>Trades (Operaciones)</th>
                    </tr>
                </thead>
                <tbody id="resultBody">
                    <tr>
                        <td colspan="4" style="text-align: center; color: #777;">Presiona el botón para escanear el mercado.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ----- LÓGICA DE CONTROL DE MODOS -----
        function toggleMode() {
            const mode = document.getElementById('modeSelect').value;
            const minVolumeInput = document.getElementById('minVolume');
            const minPriceInput = document.getElementById('minPrice');
            const minTradesInput = document.getElementById('minTrades');
            const modeStatus = document.getElementById('modeStatus');

            if (mode === 'auto') {
                // Valores estrictos preestablecidos por la estrategia institucional
                minVolumeInput.value = 500000;
                minPriceInput.value = 0.01;
                minTradesInput.value = 1000;
                
                minVolumeInput.disabled = true;
                minPriceInput.disabled = true;
                minTradesInput.disabled = true;
                
                modeStatus.textContent = "Modo: Automático (Blindado)";
            } else {
                // Permite al usuario configurar libremente
                minVolumeInput.disabled = false;
                minPriceInput.disabled = false;
                minTradesInput.disabled = false;
                
                modeStatus.textContent = "Modo: Manual (Personalizado)";
            }
        }

        // ----- FUNCIÓN PRINCIPAL DE CONEXIÓN Y FILTRADO -----
        async function fetchAndFilter() {
            const refreshBtn = document.getElementById('refreshBtn');
            const resultBody = document.getElementById('resultBody');
            const countDisplay = document.getElementById('countDisplay');

            // Capturar umbrales según el modo activo (asegurando conversión numérica estricta)
            const minVolume = parseFloat(document.getElementById('minVolume').value) || 0;
            const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
            const minTrades = parseInt(document.getElementById('minTrades').value) || 0;

            refreshBtn.disabled = true;
            refreshBtn.textContent = '⏳ Escaneando API de Binance...';

            try {
                const response = await fetch('https://api.binance.com/api/v3/ticker/24hr');
                if (!response.ok) throw new Error('Fallo al conectar con el servidor de Binance');
                
                const data = await response.json();

                // Filtrado matemático estricto anti-memecoin (excluye activos fantasmas con baja actividad)
                const filteredData = data.filter(item => {
                    const volume = parseFloat(item.quoteVolume);
                    const price = parseFloat(item.lastPrice);
                    const trades = parseInt(item.count) || 0;
                    const symbol = item.symbol;

                    // 1. Validar fin de pares que no sean USDT
                    if (!symbol.endsWith('USDT')) return false;

                    // 2. Filtro de Volumen Mínimo
                    if (volume < minVolume) return false;

                    // 3. Filtro de Precio Mínimo
                    if (price < minPrice) return false;

                    // 4. Filtro de Transacciones Mínimas (Valla clave anti-memecoin / ej: rechaza los de 74 trades)
                    if (trades < minTrades) return false;

                    return true;
                });

                // Actualizar interfaz visual
                countDisplay.textContent = `Activos institucionales válidos: ${filteredData.length}`;
                renderTable(filteredData);

            } catch (error) {
                console.error("Error en el proceso:", error);
                resultBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ff5555;">Error al obtener datos: ${error.message}</td></tr>`;
                countDisplay.textContent = "Activos válidos: 0";
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.textContent = '🔄 Analizar y Filtrar Mercado';
            }
        }

        // ----- RENDERIZADO DE TABLA -----
        function renderTable(items) {
            const resultBody = document.getElementById('resultBody');
            
            if (items.length === 0) {
                resultBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ffaa00;">Ningún activo cumple con los filtros estrictos actuales.</td></tr>`;
                return;
            }

            let html = '';
            items.forEach(item => {
                const price = parseFloat(item.lastPrice).toFixed(4);
                const volume = parseFloat(item.quoteVolume).toLocaleString('en-US', {maximumFractionDigits: 0});
                const trades = parseInt(item.count).toLocaleString('en-US');

                html += `
                    <tr>
                        <td><strong>${item.symbol}</strong></td>
                        <td>${price}</td>
                        <td>$${volume}</td>
                        <td>${trades} trades</td>
                    </tr>
                `;
            });

            resultBody.innerHTML = html;
        }
    </script>
</body>
</html>
