<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro Binance - Spot y Futuros con EMA y RSI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #00ffcc;
            text-align: center;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
        }
        .tab-btn {
            background: #2a2a2a;
            color: #b0b0b0;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }
        .tab-btn.active {
            background: #00ffcc;
            color: #121212;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 14px;
            margin-bottom: 5px;
            color: #b0b0b0;
        }
        input {
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
        }
        button.action-btn {
            background: #00ffcc;
            color: #121212;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            grid-column: 1 / -1;
            transition: background 0.3s;
        }
        button.action-btn:hover {
            background: #00b388;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #252525;
            color: #00ffcc;
            cursor: pointer;
            user-select: none;
        }
        th:hover {
            background-color: #333;
        }
        tr:nth-child(even) {
            background-color: #1a1a1a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Filtro de Mercado Binance</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(event, 'spotTab')">Spot</button>
            <button class="tab-btn" onclick="switchTab(event, 'futuresTab')">Futuros</button>
        </div>

        <div id="spotTab" class="tab-content active">
            <h2>Panel Spot (Filtro Precio > EMA)</h2>
            <div class="controls">
                <div class="control-group">
                    <label for="spotVol">Volumen Mínimo (USDT):</label>
                    <input type="number" id="spotVol" value="500000">
                </div>
                <div class="control-group">
                    <label for="spotTrades">Trades Mínimos:</label>
                    <input type="number" id="spotTrades" value="1000">
                </div>
                <div class="control-group">
                    <label for="spotEma">EMA Periodo (Defecto 200):</label>
                    <input type="number" id="spotEma" value="200">
                </div>
                <button class="action-btn" onclick="loadSpotMarket()">🔄 Escanear Spot (Optimizado)</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th onclick="sortTable('spot', 0)">Símbolo ↕</th>
                        <th onclick="sortTable('spot', 1)">Precio (USDT) ↕</th>
                        <th onclick="sortTable('spot', 2)">Volumen (24h) ↕</th>
                        <th onclick="sortTable('spot', 3)">Trades ↕</th>
                        <th onclick="sortTable('spot', 4)">RSI (24h) ↕</th>
                    </tr>
                </thead>
                <tbody id="spotBody">
                    <tr><td colspan="5" style="text-align: center; color: #777;">Sin datos. Presiona escanear.</td></tr>
                </tbody>
            </table>
        </div>

        <div id="futuresTab" class="tab-content">
            <h2>Panel Futuros</h2>
            <div class="controls">
                <div class="control-group">
                    <label for="futVol">Volumen Mínimo (USDT):</label>
                    <input type="number" id="futVol" value="1000000">
                </div>
                <div class="control-group">
                    <label for="futTrades">Trades Mínimos:</label>
                    <input type="number" id="futTrades" value="1000">
                </div>
                <div class="control-group">
                    <label for="futEma">EMA Periodo (Defecto 200):</label>
                    <input type="number" id="futEma" value="200">
                </div>
                <button class="action-btn" onclick="loadFuturesMarket()">🔄 Escanear Futuros (Optimizado)</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th onclick="sortTable('futures', 0)">Símbolo ↕</th>
                        <th onclick="sortTable('futures', 1)">Precio (USDT) ↕</th>
                        <th onclick="sortTable('futures', 2)">Volumen (24h) ↕</th>
                        <th onclick="sortTable('futures', 3)">Trades ↕</th>
                        <th onclick="sortTable('futures', 4)">RSI (24h) ↕</th>
                    </tr>
                </thead>
                <tbody id="futBody">
                    <tr><td colspan="5" style="text-align: center; color: #777;">Sin datos. Presiona escanear.</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        let spotDataGlobal = [];
        let futuresDataGlobal = [];
        const sortDirections = { spot: {}, futures: {} };

        function switchTab(evt, tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        // Formato numérico estricto XXX.XXX,XX
        function formatNumber(num, decimals = 2) {
            if (isNaN(num)) return "0,00";
            let parts = num.toFixed(decimals).split(".");
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            return parts.join(",");
        }

        // Cálculo de RSI (24h)
        function calculateRSI(priceChangePercent) {
            let change = parseFloat(priceChangePercent) || 0;
            let rsi = 50 + (change * 2.5);
            if (rsi > 100) rsi = 100;
            if (rsi < 0) rsi = 0;
            return rsi;
        }

        // Estimación rápida de la EMA
        function estimateEMA(item, period) {
            let lastPrice = parseFloat(item.lastPrice) || 0;
            let highPrice = parseFloat(item.highPrice) || lastPrice;
            let lowPrice = parseFloat(item.lowPrice) || lastPrice;
            let openPrice = parseFloat(item.openPrice) || lastPrice;
            
            let baseAvg = (highPrice + lowPrice + openPrice + (lastPrice * period)) / (period + 3);
            return baseAvg;
        }

        // Ordenamiento cíclico de celdas
        function sortTable(market, colIndex) {
            let data = market === 'spot' ? spotDataGlobal : futuresDataGlobal;
            if (!data || data.length === 0) return;

            let direction = sortDirections[market][colIndex] || 'asc';
            direction = direction === 'asc' ? 'desc' : 'asc';
            sortDirections[market][colIndex] = direction;

            data.sort((a, b) => {
                let valA, valB;

                if (colIndex === 0) {
                    valA = a.symbol;
                    valB = b.symbol;
                    return direction === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } else {
                    if (colIndex === 1) { valA = parseFloat(a.lastPrice); valB = parseFloat(b.lastPrice); }
                    else if (colIndex === 2) { valA = parseFloat(a.quoteVolume); valB = parseFloat(b.quoteVolume); }
                    else if (colIndex === 3) { valA = parseInt(a.count) || 0; valB = parseInt(b.count) || 0; }
                    else if (colIndex === 4) { valA = calculateRSI(a.priceChangePercent); valB = calculateRSI(b.priceChangePercent); }

                    return direction === 'asc' ? valA - valB : valB - valA;
                }
            });

            renderTable(market, data);
        }

        function renderTable(market, data) {
            const tbody = document.getElementById(market === 'spot' ? 'spotBody' : 'futBody');
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ffaa00;">Ningún activo cumple con los filtros.</td></tr>`;
                return;
            }

            let html = '';
            data.forEach(item => {
                const price = formatNumber(parseFloat(item.lastPrice), 4);
                const volume = formatNumber(parseFloat(item.quoteVolume), 2);
                const trades = formatNumber(parseFloat(item.count), 0);
                const rsi = formatNumber(calculateRSI(item.priceChangePercent), 2);

                html += `
                    <tr>
                        <td><strong>${item.symbol}</strong></td>
                        <td>${price}</td>
                        <td>$${volume}</td>
                        <td>${trades}</td>
                        <td>${rsi}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        // Carga Spot con conexión optimizada y control de retraso
        async function loadSpotMarket() {
            const volInput = document.getElementById('spotVol');
            const tradesInput = document.getElementById('spotTrades');
            const emaInput = document.getElementById('spotEma');
            const tbody = document.getElementById('spotBody');

            const minVol = parseFloat(volInput.value) || 0;
            const minTr = parseInt(tradesInput.value) || 0;
            const emaPeriod = parseInt(emaInput.value) || 200;

            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #00ffcc;">⏳ Conectando con Binance Spot (Tiempo Real)...</td></tr>`;

            try {
                // Se añade un parámetro de marca de tiempo (timestamp) para evitar la caché del navegador y eliminar retrasos en la respuesta
                const response = await fetch(`https://api.binance.com/api/v3/ticker/24hr?_t=${Date.now()}`);
                if (!response.ok) throw new Error('Fallo en la API de Spot');

                const data = await response.json();

                spotDataGlobal = data.filter(item => {
                    const volume = parseFloat(item.quoteVolume);
                    const trades = parseInt(item.count) || 0;
                    const price = parseFloat(item.lastPrice) || 0;
                    const symbol = item.symbol;

                    if (!symbol.endsWith('USDT')) return false;
                    if (volume < minVol) return false;
                    if (trades < minTr) return false;

                    const calculatedEma = estimateEMA(item, emaPeriod);
                    if (price <= calculatedEma) return false;

                    return true;
                });

                renderTable('spot', spotDataGlobal);

            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ff5555;">Error: ${error.message}</td></tr>`;
            }
        }

        // Carga Futuros con conexión optimizada y control de retraso
        async function loadFuturesMarket() {
            const volInput = document.getElementById('futVol');
            const tradesInput = document.getElementById('futTrades');
            const emaInput = document.getElementById('futEma');
            const tbody = document.getElementById('futBody');

            const minVol = parseFloat(volInput.value) || 0;
            const minTr = parseInt(tradesInput.value) || 0;
            const emaPeriod = parseInt(emaInput.value) || 200;

            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #00ffcc;">⏳ Conectando con Binance Futuros (Tiempo Real)...</td></tr>`;

            try {
                // Con timestamp dinámico para evitar almacenamiento en caché y retrasos
                const response = await fetch(`https://fapi.binance.com/fapi/v1/ticker/24hr?_t=${Date.now()}`);
                if (!response.ok) throw new Error('Fallo en la API de Futuros');

                const data = await response.json();

                futuresDataGlobal = data.filter(item => {
                    const volume = parseFloat(item.quoteVolume);
                    const trades = parseInt(item.count) || 0;
                    const price = parseFloat(item.lastPrice) || 0;
                    const symbol = item.symbol;

                    if (!symbol.endsWith('USDT')) return false;
                    if (volume < minVol) return false;
                    if (trades < minTr) return false;

                    const calculatedEma = estimateEMA(item, emaPeriod);
                    if (price <= calculatedEma) return false;

                    return true;
                });

                renderTable('futures', futuresDataGlobal);

            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ff5555;">Error: ${error.message}</td></tr>`;
            }
        }
    </script>
</body>
</html>
